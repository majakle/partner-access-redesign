  <rect x="148" y="158" width="664" height="44" rx="6" fill="#E6EBE6" stroke="#B8B8B8"/>
  <text x="164" y="185" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#262626">Thank you — your partner application is with our team.</text>
  <text x="148" y="255" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#262626">You’re one step closer</text>
  <text x="148" y="285" font-family="Inter, Arial, sans-serif" font-size="13" fill="#737373">We’re reviewing your details so we can welcome the right partners.</text>
  <text x="148" y="330" font-family="Inter, Arial, sans-serif" font-size="14" fill="#262626">1  You’ll receive an email confirming we have your application.</text>
  <text x="148" y="362" font-family="Inter, Arial, sans-serif" font-size="14" fill="#262626">2  Our team carefully reviews every partner request.</text>
  <text x="148" y="394" font-family="Inter, Arial, sans-serif" font-size="14" fill="#262626">3  You’ll hear from us within 3 business days.</text>
  <text x="148" y="418" font-family="Inter, Arial, sans-serif" font-size="13" fill="#737373">If approved, we’ll show you how to get started.</text>
